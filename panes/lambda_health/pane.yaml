id: default:lambda_health
# A pane type: its inputs, the actions that fill its outputs, and how it's laid out.
# Check finds any mistake with its line; Create makes it, for your group at once.
label: Lambda health
description: Lambda functions with their invocation and error counts over the last N days, sorted by error rate.
category: Services
inputs:
  - key: connection
    type: connection
    connection_type: aws
    label: Environment
  - key: days
    type: int
    label: Days
    default: 7
    min: 1
    max: 30
actions:
  - id: analyze
    main: true
    run_label: Analyze
    code:
      file: lambda_health.py
outputs:
  - key: rows
    render: table
    actions:
      - select
      - copy
      - export
layout:
  - title: Lambda functions
    clear:
      - rows
    items:
      - input: connection
      - row:
          - input: days
      - toolbar:
          - action: analyze
      - output: rows

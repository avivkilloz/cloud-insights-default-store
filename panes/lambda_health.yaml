id: default:lambda_health
# A pane type: its inputs, the actions that fill its outputs, and how it's laid out.
# Check finds any mistake with its line; Create makes it, for your group at once.
label: Lambda health
description: Lambda functions with their invocation and error counts over the last N days, sorted by error rate.
category: Services
inputs:
  - key: connection
    type: connection
    connection_type: aws
    label: Environment
  - key: days
    type: int
    label: Days
    default: 7
    min: 1
    max: 30
actions:
  - id: analyze
    main: true
    run_label: Analyze
    code: "def run(inputs, ctx):\n    import time\n    from datetime import datetime, timedelta\n    \n    conn = inputs[\"connection\"]\n    days = inputs.get(\"days\", 7)\n    \n    # Get all Lambda functions\n    lambdas_resp = ctx.aws(conn, \"lambda\", \"ListFunctions\", paginate=True)\n    functions = lambdas_resp.get(\"Functions\", [])\n    \n    # Time window for CloudWatch\n    now = datetime.utcnow()\n    start = now - timedelta(days=days)\n    start_str = start.strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    end_str = now.strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    \n    rows = []\n    for func in functions:\n        name = func[\"FunctionName\"]\n        \n        # Get Invocations metric\n        inv_resp = ctx.aws(conn, \"cloudwatch\", \"GetMetricStatistics\", {\n            \"Namespace\": \"AWS/Lambda\",\n            \"MetricName\": \"Invocations\",\n            \"Dimensions\": [{\"Name\": \"FunctionName\", \"Value\": name}],\n            \"StartTime\": start_str,\n            \"EndTime\": end_str,\n            \"Period\": days * 86400,\n            \"Statistics\": [\"Sum\"]\n        })\n        \n        # Get Errors metric\n        err_resp = ctx.aws(conn, \"cloudwatch\", \"GetMetricStatistics\", {\n            \"Namespace\": \"AWS/Lambda\",\n            \"MetricName\": \"Errors\",\n            \"Dimensions\": [{\"Name\": \"FunctionName\", \"Value\": name}],\n            \"StartTime\": start_str,\n            \"EndTime\": end_str,\n            \"Period\": days * 86400,\n            \"Statistics\": [\"Sum\"]\n        })\n        \n        inv_datapoints = inv_resp.get(\"Datapoints\", [])\n        err_datapoints = err_resp.get(\"Datapoints\", [])\n        \n        invocations = sum(d.get(\"Sum\", 0) for d in inv_datapoints) if inv_datapoints else 0\n        errors = sum(d.get(\"Sum\", 0) for d in err_datapoints) if err_datapoints else 0\n        \n        error_rate = (errors / invocations * 100) if invocations > 0 else 0\n        \n        rows.append({\n            \"Function\": name,\n            \"Invocations\": invocations,\n            \"Errors\": errors,\n            \"Error rate\": round(error_rate, 2)\n        })\n    \n    # Sort by error rate descending\n    rows.sort(key=lambda r: r[\"Error rate\"], reverse=True)\n    ctx.log(f\"Checked {len(rows)} Lambda functions\")\n    \n    return {\"rows\": rows}"
outputs:
  - key: rows
    render: table
    actions:
      - select
      - copy
      - export
layout:
  - title: Lambda functions
    clear:
      - rows
    items:
      - input: connection
      - row:
          - input: days
      - toolbar:
          - action: analyze
      - output: rows

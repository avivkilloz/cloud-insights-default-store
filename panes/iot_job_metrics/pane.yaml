id: default:iot_job_metrics
label: IoT OTA Jobs
description: List IoT OTA jobs with execution status counts. Expand a job for details including job document, targets, and thing group queries.
category: Services
inputs:
  - key: connections
    type: connections
    connection_type: aws
    label: Environments
    default: []
  - key: statusFilter
    type: choice
    label: Status filter
    choices: ['', IN_PROGRESS, COMPLETED, CANCELED, DELETION_IN_PROGRESS]
    choice_labels:
      ? ''
      : All
      IN_PROGRESS: In Progress
      COMPLETED: Completed
      CANCELED: Canceled
      DELETION_IN_PROGRESS: Deletion In Progress
    optional: true
    default: ""
actions:
  - id: list
    main: true
    run_label: List Jobs
    busy_label: Listing jobs...
    request:
      connection: connections
      service: iot
      operation: ListJobs
      output: jobs
      paginate: true
      params:
        status:
          input: statusFilter
      rows:
        at: jobs
        columns:
          Job ID: jobId
          Status: status
          Target Selection: targetSelection
          Concurrent: isConcurrent
          Created: createdAt
          Last Updated: lastUpdatedAt
          Completed: completedAt
    resets:
      - view.expanded
  - id: detail
    run_label: Load details
    code:
      file: job_detail.py
    args:
      connection: row.Environment
      jobId: row.Job ID
outputs:
  - key: jobs
    render: table
    actions: [select, copy, export, attach]
    config:
      expand: expanded
      domain: iot-jobs
      detail:
        action: detail
        sections:
          - title: Job Details
            fields:
              - label: Job ID
                value: '{{ d.job_id }}'
              - label: Status
                value: '{{ d.status }}'
              - label: Target Selection
                value: '{{ d.target_selection }}'
              - label: Description
                value: '{{ d.description ?? ''—'' }}'
              - label: Concurrent
                value: '{{ d.is_concurrent }}'
          - title: Execution Summary
            fields:
              - label: Queued
                value: '{{ d.processing.queued }}'
              - label: In Progress
                value: '{{ d.processing.in_progress }}'
              - label: Succeeded
                value: '{{ d.processing.succeeded }}'
              - label: Failed
                value: '{{ d.processing.failed }}'
              - label: Canceled
                value: '{{ d.processing.canceled }}'
              - label: Rejected
                value: '{{ d.processing.rejected }}'
              - label: Timed Out
                value: '{{ d.processing.timed_out }}'
              - label: Removed
                value: '{{ d.processing.removed }}'
          - title: Job Document
            json: job_document
            empty: No job document available.
          - title: Targets
            table: targets
            empty: No targets found.
            columns:
              - label: Name
                value: '{{ row.name }}'
              - label: Type
                value: '{{ row.type }}'
              - label: Query
                value: '{{ row.query ?? ''—'' }}'
  - key: error
    render: error
views:
  - key: expanded
    default: []
  - key: expanded
    default: []
layout:
  - title: 1. Choose environments
    items:
      - input: connections
  - title: 2. Filter and list
    items:
      - toolbar:
          - input: statusFilter
          - action: list
  - title: 3. Jobs
    clear:
      - jobs
    items:
      - restored: list
      - output: error
      - output: jobs

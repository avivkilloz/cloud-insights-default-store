id: default:iot_job_metrics
label: IoT OTA Jobs
description: List IoT OTA jobs with execution status counts. Expand a job for details including job document, targets, and thing group queries.
category: Services
inputs:
  - key: connections
    type: connections
    connection_type: aws
    label: Environments
    default: []
  - key: statusFilter
    type: choice
    label: Status filter
    choices: ['', IN_PROGRESS, COMPLETED, CANCELED, DELETION_IN_PROGRESS]
    choice_labels:
      ? ''
      : All
      IN_PROGRESS: In Progress
      COMPLETED: Completed
      CANCELED: Canceled
      DELETION_IN_PROGRESS: Deletion In Progress
    optional: true
    default: ""
actions:
  - id: list
    main: true
    run_label: List Jobs
    busy_label: Listing jobs...
    request:
      connection: connections
      service: iot
      operation: ListJobs
      output: jobs
      paginate: true
      params:
        status:
          input: statusFilter
      rows:
        at: jobs
        columns:
          Job ID: jobId
          Status: status
          Target Selection: targetSelection
          Concurrent: isConcurrent
          Created: createdAt
          Last Updated: lastUpdatedAt
          Completed: completedAt
    resets:
      - view.expanded
  - id: detail
    run_label: Load details
    code:
      file: job_detail.py
    args:
      connection: row.Environment
      jobId: row.jobId
  - id: export_details
    run_label: Export selected with details
    args:
      connections: row.Environment
      job_id: row.jobId
    code:
      file: job_export.py
outputs:
  - key: jobs
    render: table
    actions:
      - select
      - copy
      - export
      - attach
    config:
      expand: expanded
      domain: iot-jobs
      detail:
        action: detail
        sections:
          - title: Job Details
            fields:
              - label: Job ID
                value: '{{ d.job_id }}'
              - label: Status
                value: '{{ d.status }}'
              - label: Target Selection
                value: '{{ d.target_selection }}'
              - label: Description
                value: '{{ d.description ?? ''—'' }}'
              - label: Concurrent
                value: '{{ d.is_concurrent }}'
          - title: Execution Summary
            fields:
              - label: Queued
                value: '{{ d.job_process_details.number_of_queued_things ?? ''0'' }}'
              - label: In Progress
                value: '{{ d.job_process_details.number_of_in_progress_things ?? ''0'' }}'
              - label: Succeeded
                value: '{{ d.job_process_details.number_of_succeeded_things ?? ''0'' }}'
              - label: Failed
                value: '{{ d.job_process_details.number_of_failed_things ?? ''0'' }}'
              - label: Canceled
                value: '{{ d.job_process_details.number_of_canceled_things ?? ''0'' }}'
              - label: Rejected
                value: '{{ d.job_process_details.number_of_rejected_things ?? ''0'' }}'
              - label: Timed Out
                value: '{{ d.job_process_details.number_of_timed_out_things ?? ''0'' }}'
              - label: Removed
                value: '{{ d.job_process_details.number_of_removed_things ?? ''0'' }}'
          - title: Job Document
            json: job_document
            empty: No job document available.
          - title: Targets
            table: targets
            empty: No targets found.
            columns:
              - label: Name
                value: '{{ row.name }}'
              - label: Type
                value: '{{ row.type }}'
              - label: Query
                value: '{{ row.query ?? ''—'' }}'
  - key: jobDetails
    render: table
    actions:
      - export
      - copy
    label: Job Details Export
  - key: error
    render: error
layout:
  - title: 1. Choose environments
    items:
      - input: connections
  - title: 2. Filter and list
    items:
      - toolbar:
          - input: statusFilter
          - action: list
  - title: 3. Jobs
    clear:
      - jobs
      - jobDetails
    items:
      - restored: list
      - toolbar:
          - action: export_details
            when:
              output: jobs
              present: true
      - output: error
      - output: jobs
      - output: jobDetails
        when:
          output: jobDetails
          present: true
views:
  - key: expanded
    default: []
